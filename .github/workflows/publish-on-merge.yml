name: 'Publish on Merge'

on:
    push:
        branches:
            - trunk

jobs:
    install:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout DIVE
              uses: actions/checkout@main
            - name: Setup Node.js
              uses: actions/setup-node@main
            - name: Search for cached dependencies
              uses: actions/cache@main
              id: yarn-cache
              with:
                  path: node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
            - name: Install DIVE dependencies (if cache not found)
              if: steps.yarn-cache.outputs.cache-hit != 'true'
              run: yarn
    eslint:
        runs-on: ubuntu-latest
        needs: install
        steps:
            - name: Checkout DIVE
              uses: actions/checkout@main
            - name: Search for cached dependencies
              uses: actions/cache@main
              id: yarn-cache
              with:
                  path: node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
            - name: Install DIVE dependencies (if cache not found)
              if: steps.yarn-cache.outputs.cache-hit != 'true'
              run: yarn
            - name: Lint DIVE
              run: yarn lint
    unit:
        runs-on: ubuntu-latest
        needs: install
        steps:
            - name: Checkout DIVE
              uses: actions/checkout@main
            - name: Search for cached dependencies
              uses: actions/cache@main
              id: yarn-cache
              with:
                  path: node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
            - name: Install DIVE dependencies (if cache not found)
              if: steps.yarn-cache.outputs.cache-hit != 'true'
              run: yarn
            - name: Unit-Test DIVE
              run: yarn coverage
            - name: Upload coverage to Codecov (set new baseline)
              run: npx codecov -f coverage/coverage-final.json -B
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    prettier-fix:
        runs-on: ubuntu-latest
        needs: install
        steps:
            - name: Checkout DIVE
              uses: actions/checkout@main
            - name: Search for cached dependencies
              uses: actions/cache@main
              id: yarn-cache
              with:
                  path: node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
            - name: Install DIVE dependencies (if cache not found)
              if: steps.yarn-cache.outputs.cache-hit != 'true'
              run: yarn
            - name: Prettier fix DIVE
              run: yarn prettier:fix && git add .
    publish:
        runs-on: ubuntu-latest
        needs: [eslint, unit, prettier-fix]
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '20'
            - name: Search for cached dependencies
              uses: actions/cache@v4
              id: yarn-cache
              with:
                  path: node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
            - name: Install dependencies (if cache not found)
              if: steps.yarn-cache.outputs.cache-hit != 'true'
              run: yarn

            - name: Build DIVE
              run: yarn build

            - name: 'Add package.json to git'
              run: git add package.json

            - name: Generate docs
              run: yarn docs

            - name: 'Add generated docs to git'
              run: git add .

            - name: 'Automated Version Bump'
              uses: 'phips28/gh-action-bump-version@master'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_USER: 'DIVE[bot]'
                  GITHUB_EMAIL: 'f.frank@shopware.com'
              with:
                  target-branch: 'trunk'
                  commit-message: 'DIVE[bot]: Release {{version}} [skip ci]'
                  skip-push: 'true'
                  skip-tag: 'true'

            - name: Push to protected branch trunk
              uses: CasperWA/push-protected@v2
              with:
                  token: ${{ secrets.PUSH_TO_PROTECTED_BRANCH }}
                  branch: trunk
                  unprotect_reviews: true
                  tags: true
                  force: true

            - name: 'Create release branch'
              run: git checkout -b release/$(node -p "require('./package.json').version")

            - name: 'Add Build files to git'
              run: git add ./build -f && echo "Staged build files! Status:" && git status
            - name: 'Commit changes'
              run: echo "Committing ..." && git commit -m "Release $(node -p "require('./package.json').version")" && echo "Committed! Status:" && git status
            - name: 'Add tag'
              run: git tag -a $(node -p "require('./package.json').version") -m "Release $(node -p "require('./package.json').version")"
            - name: 'Push to release branch'
              run: git push origin release/$(node -p "require('./package.json').version") && git push origin tag $(node -p "require('./package.json').version")
            - name: Publish DIVE to npm
              uses: JS-DevTools/npm-publish@v3
              with:
                  token: ${{ secrets.NPM_TOKEN }}
                  access: 'public'
                  dry-run: false
