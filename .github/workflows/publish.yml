name: 'Publish'

on:
    push:
        branches:
            - trunk
    workflow_dispatch:

jobs:
    install:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout DIVE
              uses: actions/checkout@main
            - name: Setup Node.js
              uses: actions/setup-node@main
            - name: Search for cached dependencies
              uses: actions/cache@main
              id: yarn-cache
              with:
                  path: node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
            - name: Install DIVE dependencies (if cache not found)
              if: steps.yarn-cache.outputs.cache-hit != 'true'
              run: yarn
    eslint:
        runs-on: ubuntu-latest
        needs: install
        steps:
            - name: Checkout DIVE
              uses: actions/checkout@main
            - name: Search for cached dependencies
              uses: actions/cache@main
              id: yarn-cache
              with:
                  path: node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
            - name: Install DIVE dependencies (if cache not found)
              if: steps.yarn-cache.outputs.cache-hit != 'true'
              run: yarn
            - name: Lint DIVE
              run: yarn lint
    unit:
        runs-on: ubuntu-latest
        needs: install
        steps:
            - name: Checkout DIVE
              uses: actions/checkout@main
            - name: Search for cached dependencies
              uses: actions/cache@main
              id: yarn-cache
              with:
                  path: node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
            - name: Install DIVE dependencies (if cache not found)
              if: steps.yarn-cache.outputs.cache-hit != 'true'
              run: yarn
            - name: Unit-Test DIVE
              run: yarn coverage
            - name: Upload coverage to Codecov (set new baseline)
              uses: codecov/codecov-action@v5
              with:
                  files: ./coverage/coverage-final.json
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: true
    prettier-fix:
        runs-on: ubuntu-latest
        needs: install
        steps:
            - name: Checkout DIVE
              uses: actions/checkout@main
            - name: Search for cached dependencies
              uses: actions/cache@main
              id: yarn-cache
              with:
                  path: node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
            - name: Install DIVE dependencies (if cache not found)
              if: steps.yarn-cache.outputs.cache-hit != 'true'
              run: yarn
            - name: Prettier fix DIVE
              run: yarn prettier:fix && git add .
    publish:
        runs-on: ubuntu-latest
        needs: [eslint, unit, prettier-fix]
        permissions:
            id-token: write
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
            - name: Search for cached dependencies
              uses: actions/cache@v4
              id: yarn-cache
              with:
                  path: node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
            - name: Install dependencies (if cache not found)
              if: steps.yarn-cache.outputs.cache-hit != 'true'
              run: yarn

            - name: Register git user
              run: |
                  git config user.name "GitHub Actions"
                  git config user.email "actions@github.com"

            # Beta only: calculate and set beta version
            - name: Calculate next beta version
              if: github.event_name == 'workflow_dispatch'
              id: calculate-beta
              run: |
                  git fetch --tags

                  current_version=$(node -p "require('./package.json').version")

                  prefix="$current_version-beta."
                  last_beta=$(git tag --list "${prefix}*" | sed "s/${prefix}//" | sort -n | tail -n 1)

                  if [ -z "$last_beta" ]; then
                    next_beta="$current_version-beta.0"
                  else
                    next_beta="$current_version-beta.$((last_beta + 1))"
                  fi

                  echo "next_beta=$next_beta" >> $GITHUB_OUTPUT

            - name: Update package.json with beta version
              if: github.event_name == 'workflow_dispatch'
              run: |
                  npm version --no-git-tag-version ${{ steps.calculate-beta.outputs.next_beta }}
                  git add package.json

            - name: Build DIVE
              run: yarn build

            # Publish: release or beta
            - name: Publish DIVE to npm
              if: github.event_name == 'push'
              run: npm publish --access public

            - name: Publish DIVE beta to npm
              if: github.event_name == 'workflow_dispatch'
              run: npm publish --access public --tag beta

            # Release only: tag, version bump, push
            - name: Add release tag
              if: github.event_name == 'push'
              run: git tag -a $(node -p "require('./package.json').version") -m "DIVE Release Version $(node -p "require('./package.json').version")"

            - name: Push release tag
              if: github.event_name == 'push'
              run: git push origin tag $(node -p "require('./package.json').version")

            - name: Automated Version Bump
              if: github.event_name == 'push'
              uses: 'phips28/gh-action-bump-version@master'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_USER: 'GitHub Actions'
                  GITHUB_EMAIL: 'actions@github.com'
              with:
                  target-branch: 'trunk'
                  commit-message: 'Automated Version Bump [skip ci]'
                  skip-push: 'true'
                  skip-tag: 'true'
                  version-type: 'patch'

            - name: Push to protected branch trunk
              if: github.event_name == 'push'
              uses: CasperWA/push-protected@v2
              with:
                  token: ${{ secrets.PUSH_TO_PROTECTED_BRANCH }}
                  branch: trunk
                  unprotect_reviews: true
                  tags: true
                  force: true

            # Beta only: tag and push
            - name: Add beta tag
              if: github.event_name == 'workflow_dispatch'
              run: git tag -a ${{ steps.calculate-beta.outputs.next_beta }} -m "DIVE Beta Version ${{ steps.calculate-beta.outputs.next_beta }}"

            - name: Push beta tag
              if: github.event_name == 'workflow_dispatch'
              run: git push origin tag ${{ steps.calculate-beta.outputs.next_beta }}
